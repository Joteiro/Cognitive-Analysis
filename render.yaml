services:
  - type: web
    name: cognitive-analysis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # lo ingresás manualmente en el dashboard de Render
      # Sin ADMIN_KEY, /admin/* responde 503: el modo admin nace apagado.
      # Poner una larga y al azar (>= 16 caracteres).
      - key: ADMIN_KEY
        sync: false
      # Solo para generar quizzes desde la web.
      - key: GEMINI_API_KEY
        sync: false
